[project]
name = "accessmap"
version = "0.1.0"
description = "Accessibility map and routing for people on wheels, from street-level imagery"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests>=2.32",
    "osmnx>=2.0",
    "networkx>=3.3",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "pillow>=10.4",
    "py360convert>=1.0",
    "google-genai>=1.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tqdm>=4.66",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
accessmap = "accessmap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accessmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
